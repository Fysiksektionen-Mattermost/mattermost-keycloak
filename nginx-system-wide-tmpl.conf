server {
    server_name kc.mattermost.fysiksektionen.se; # managed by Certbot

    location / {
        proxy_pass http://127.0.0.1:8080; # 8080 points to nginx running in Docker

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # binds to the original IP
        proxy_set_header X-Forwarded-Proto https; # correct internal redirects in Keycloak
        proxy_set_header X-Forwarded-Port 443; # correct internal redirects in Keycloak
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kc.mattermost.fysiksektionen.se/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kc.mattermost.fysiksektionen.se/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
}


server {
    if ($host = kc.mattermost.fysiksektionen.se) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 ;
    server_name kc.mattermost.fysiksektionen.se;
    return 404; # managed by Certbot
}