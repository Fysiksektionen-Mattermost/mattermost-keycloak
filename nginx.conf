events {}

user nginx;

http {
  resolver 127.0.0.11 valid=30s;

  server {
    listen 8080;
    listen [::]:8080;

    location = / {
     return 404;
    }

    location = /register {
      return 302 https://$host/realms/mattermost/protocol/openid-connect/registrations?client_id=mattermost-reg-bridge&response_type=code&scope=openid&redirect_uri=https://mattermost.fysiksektionen.se/login/sso/saml;
    }

    location = /admin {
      return 404;
    }

    location ^~ /admin/ {
      return 404;
    }

    location = /metrics {
      return 404;
    }

    location ^~ /metrics/ {
      return 404;
    }

    location = /health {
      return 404;
    }

    location ^~ /health/ {
      return 404;
    }

    location / {
      set $keycloak_upstream keycloak:8080;
      proxy_pass http://$keycloak_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
    }
  }

  server {
    listen 9000;
    listen [::]:9000;

    location / {
      set $keycloak_upstream keycloak:9000;
      proxy_pass http://$keycloak_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port $server_port;
    }
  }

  server {
    listen 9001 ssl;
    listen [::]:9001 ssl;

    # Redirect HTTP requests to HTTPS
    error_page 497 =301 https://$host:$server_port$request_uri;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /admin {
      return 302 /admin/master/console/;
    }

    location = /admin/ {
      return 302 /admin/master/console/;
    }

    location / {
      set $keycloak_upstream keycloak:8080;
      proxy_pass http://$keycloak_upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port $server_port;
    }
  }
}
