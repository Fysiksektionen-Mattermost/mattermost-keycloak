services:
  keycloak-db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
    env_file:
      - ./keycloak-secrets.env
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - keycloak

  keycloak:
    build:
      context: .
      dockerfile: Containerfile
    command: ["start", "--optimized"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: mattermost.fysiksektionen.se:8080
      KC_HOSTNAME_ADMIN: https://localhost:9001
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_PROXY_HEADERS: xforwarded
    env_file:
      - ./keycloak-secrets.env
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 1g
    ports:
      - "127.0.0.1:8080:8080" # change to "8080:8080" for production
      - "127.0.0.1:9000:9000"
    networks:
      - keycloak

  keycloak-import:
    profiles:
      - import
    build:
      context: .
      dockerfile: Containerfile
    command: ["import", "--optimized", "--file=/opt/keycloak/data/import/realm.json"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: mattermost.fysiksektionen.se:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_PROXY_HEADERS: xforwarded
    env_file:
      - ./keycloak-secrets.env
    networks:
      - keycloak
    volumes:
      - ${KEYCLOAK_REALM_BK_FOLDER}/mattermost-keycloak-realm-0.json:/opt/keycloak/data/import/realm.json:ro

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      - keycloak
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    ports:
      - "127.0.0.1:9001:9001"
    networks:
      - keycloak
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
      - ./tls/privkey.pem:/etc/nginx/tls/privkey.pem:ro

volumes:
  keycloak-postgres-data:

networks:
  keycloak:
    driver: bridge
